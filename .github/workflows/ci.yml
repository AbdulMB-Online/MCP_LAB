name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Container checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build development image
        run: docker build --target development -t mcp-lab:ci .

      - name: Verify Python environment
        run: docker run --rm mcp-lab:ci python --version

      - name: Check lint
        run: docker run --rm mcp-lab:ci python -m ruff check .

      - name: Check formatting
        run: docker run --rm mcp-lab:ci python -m ruff format --check .

      - name: Enforce unit test line coverage
        run: docker run --rm mcp-lab:ci python -m pytest tests/unit --cov --cov-report=term-missing --cov-fail-under=100

      - name: Report unit test branch coverage
        run: docker run --rm mcp-lab:ci python -m pytest tests/unit --cov --cov-branch --cov-report=term-missing

      - name: Run integration tests
        run: docker run --rm mcp-lab:ci python -m pytest tests/integration
