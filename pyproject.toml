[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-lab"
version = "0.1.0"
description = "MCP-based IT equipment request handler"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["socket: starts an MCP server on a real loopback socket"]

[tool.coverage.run]
source = ["src/mcp_lab"]

[tool.coverage.report]
include_namespace_packages = true
# Unit tests exercise main() directly. Socket smoke tests launch the modules.
exclude_also = ['^if __name__ == "__main__":']

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
